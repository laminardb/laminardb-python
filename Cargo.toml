[package]
name = "laminardb"
version = "0.30.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Python bindings for LaminarDB streaming SQL database"
publish = false

[lib]
name = "_laminardb"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py311", "anyhow"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
pyo3-arrow = "0.17"

arrow = { version = "=58.4.0", features = ["ffi"] }
arrow-array = "=58.4.0"
arrow-schema = "=58.4.0"
arrow-json = "=58.4.0"
arrow-csv = "=58.4.0"

laminar-db = { path = "laminardb/crates/laminar-db", package = "laminar-db", default-features = false, features = [
    "api",
    "kafka",
    "postgres-cdc",
    "postgres-sink",
    "delta-lake",
    "websocket",
    "iceberg",
    "parquet-lookup",
    "files",
    "mongodb-cdc",
    "otel",
    "nats",
] }
laminar-core = { path = "laminardb/crates/laminar-core", package = "laminar-core" }

serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
futures = "0.3"
parking_lot = "0.12"
anyhow = "1"

[features]
default = []
# Cloud storage backends for Delta Lake / Iceberg connectors
delta-lake-s3 = ["laminar-db/delta-lake-s3"]
delta-lake-azure = ["laminar-db/delta-lake-azure"]
delta-lake-gcs = ["laminar-db/delta-lake-gcs"]
delta-lake-unity = ["laminar-db/delta-lake-unity"]
delta-lake-glue = ["laminar-db/delta-lake-glue"]
# Enable all cloud storage backends
cloud-all = ["delta-lake-s3", "delta-lake-azure", "delta-lake-gcs"]

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
